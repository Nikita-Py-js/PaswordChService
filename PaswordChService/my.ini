; ==========================================================
;  Конфигурация службы PaswordChService
;  Периодическая смена паролей пользователей.
;  Изменения вступают в силу при перезапуске службы.
;
;  Все пути относительны папки, где лежит PaswordChService.exe
;  (по умолчанию C:\Program Files\PaswordCh).
;
;  Пароли, помеченные ниже как <...>, можно указывать:
;    1) в открытом виде  — при первом запуске служба сама зашифрует
;                          их и перезапишет my.ini значениями ENC:...;
;    2) сразу как ENC:... — получить строку можно командой:
;                          PaswordChService.exe encrypt <пароль>
; ==========================================================

[Branding]
; Логотип/название компании в виде ГОТОВОГО HTML.
; Сюда можно вставить любой HTML: <span>, <b>, <img>, шрифты, цвета и т.п.
; Значение подставляется в шаблон письма БЕЗ экранирования.
;
; ВАЖНО: символы ; и # должны идти сразу за содержимым, без пробела перед ними.
;         Если нужно экранировать цвет — используйте rgb(...) вместо #hex.
;
; Примеры:
;   CompanyBrandHtml=<span style="color:#ffffff;">EF</span><span style="color:#ffcc00;">SOL</span>
;   CompanyBrandHtml=<span style="color:#ffcc00;">EFSOL</span>
;   CompanyBrandHtml=<img src="https://efsol.ru/logo-white.png" alt="EFSOL" height="28" style="display:block;border:0;">
CompanyBrandHtml=<span style="color:#000000;font-weight:900;letter-spacing:1px;">EFSOL</span>

; Название компании простым текстом (для подвала и служебных полей).
CompanyName=EFSOL

; Слоган под логотипом в шапке письма.
CompanyTagline=Единая экосистема управления и автоматизации бизнеса

; Контакты в подвале писем.
CompanySite=https://efsol.ru
CompanyEmail=info@efsol.ru
CompanyPhone=+7 (495) 120-20-40

; Название компании-клиента, которая получает письма.
; Если не задано — используется CompanyName.
ClientCompanyName=ООО «Ромашка»

; Строка вендора в подвале. Если убрать оба параметра — будут использованы
; Чтобы отключить строку полностью — оставьте оба параметра пустыми.
VendorLine=Решение компании EFSOL
VendorUrl=https://efsol.ru

; Тема письма пользователю. Поддерживает:
;   {{UserName}}          — логин
;   {{ClientCompanyName}} — компания клиента
;   {{CompanyName}}       — наша компания
EmailUserSubject=[{{CompanyName}}]:Смена пароля для {{UserName}} — {{ClientCompanyName}}

; Тема отчёта администраторам о завершённом цикле.
EmailAdminSubject=[{{CompanyName}}]: отчёт о смене паролей ({{TotalSuccess}} успешно, {{TotalErrors}} ошибок)




[Service]
; Смена паролей раз в N дней.
IntervalDays=30

; Как часто служба проверяет "пора ли запускать цикл" (в минутах).
; Рекомендуется 15–60. На саму смену не влияет — только на момент её старта.
CheckIntervalMinutes=15

; Через сколько часов архивировать service.log
LogArchiveHours=24

[Users]
; Режим работы: Local — локальные пользователи, AD — Active Directory
Mode=Local

; Для режима AD:
Domain=
AdAdminUser=
AdAdminPassword=

; Длина генерируемого пароля
PasswordLength=12

[Archive]
; Пароль для AES-шифрования содержимого ZIP-архива. ОБЯЗАТЕЛЬНО СМЕНИТЬ!
ZipPassword=

[Mail]
; Список email-адресов администраторов через ; или ,
AdminEmails=

SmtpHost=
SmtpPort=587
SmtpUseSsl=true
SmtpUser=
SmtpPassword=
SmtpFrom=

; Отправлять ли уведомления самим пользователям о смене пароля
SendEmailsToUsers=true

SmtpTimeoutMs=30000

[Access]
; Логины с ролью "менеджер". Могут менять пароли любых пользователей,
; кроме перечисленных в ProtectedUsers. Разделитель: ; или ,
Managers=Администратор;test

; Защищённые логины. Их пароль не может сменить НИКТО:
; ни менеджер, ни сам владелец, ни автоцикл службы.
;
; Логин МОЖЕТ быть указан и в Managers, и здесь одновременно:
; тогда он менеджер (меняет чужие пароли), но его собственный пароль
; защищён.
;
; Разделитель: ; или ,
ProtectedUsers=Administrator;efsol_it


[OneTimePassword]
; Использовать API одноразовых паролей для отправки пользователям
; вместо пароля открытым текстом в письме.
UseApi=false

; URL корня API (без /Api.ashx)
ApiUrl=http://localhost:8011

; Ключ API. Совпадает с ApiKey в Web.config веб-сервиса.
ApiKey=

; TTL ссылки в минутах. 1440 = сутки, 10080 = 7 дней.
TtlMinutes=1440

; Если API не сработал — отправлять ли обычное письмо с паролем.
; true = мягкий fallback (пользователь получит пароль в любом случае);
; false = не отправлять, в лог WARN (пароль только в ZIP-архиве).
FallbackToPlain=true

; Игнорировать ошибки валидации SSL-сертификата.
; Включать ТОЛЬКО если API с самоподписанным сертификатом во внутренней сети.
IgnoreSslErrors=false